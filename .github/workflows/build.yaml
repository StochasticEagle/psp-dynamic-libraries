name: psp-dynamic-libraries

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PSPSDK_CFW_REV: 9702264002efcbaef95e2e72a7e5ea3699165a85

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev

    steps:
      - name: Host dependencies
        run: |
          apk add --no-cache             autoconf             automake             clang             cmake             git             ninja             py3-ecdsa             py3-pycryptodomex             python3             zip             zlib-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: PSP library dependencies
        run: |
          psp-pacman -Syy --noconfirm
          psp-pacman -S --needed --noconfirm             bzip2             liblzma             libpng             libpspav             libpspftp             unarr             zlib

      - name: Checkout pinned integrated PSPSDK
        run: |
          git clone --branch dev/fork https://github.com/StochasticEagle/pspsdk.git pspsdk
          git -C pspsdk checkout --detach "$PSPSDK_CFW_REV"
          git -C pspsdk submodule update --init --recursive --depth 1
          test "$(git -C pspsdk rev-parse HEAD)" = "$PSPSDK_CFW_REV"

      - name: Build and install PSPSDK
        working-directory: pspsdk
        run: |
          bash ./bootstrap
          ./configure
          make -j "$(getconf _NPROCESSORS_ONLN)"
          make install
          ./build-cfw-and-install.sh

      - name: Configure
        run: |
          cmake             -S .             -B build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$PSPDEV/psp/share/pspdev.cmake"             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Verify release contents
        run: |
          for prx in             idsregeneration.prx             iop.prx             ipl_update.prx             kbooti_update.prx             libpng.prx             pspav.prx             pspftp.prx             kpspident.prx             unarchive.prx             usbdevice.prx             intraFont-vlf.prx             lflash_fdisk.prx             libpsardumper.prx             pspdecrypt.prx             vlf.prx
          do
            test -s "build/dist/LIBS/$prx"
          done

          count="$(find build/dist/LIBS -maxdepth 1 -type f -name '*.prx' | wc -l | tr -d ' ')"
          test "$count" -eq 15

      - name: Compress
        run: |
          cd build/dist/LIBS
          zip -9 -r ../../../LIBS.zip .

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: psp-dynamic-libraries-release
          path: LIBS.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: psp-dynamic-libraries-release
          path: .

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: psp-dynamic-libraries
          prerelease: false
          files: LIBS.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
